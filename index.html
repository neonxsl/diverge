<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diverge</title>
  <meta name="description" content="A party game where the only rule is: don't say what everyone else says.">
  <meta name="theme-color" content="#f6f0e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)">
  <script>try { var t = localStorage.getItem('diverge:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' rx='14' fill='%23ffc533' stroke='%231c1915' stroke-width='5'/><text x='32' y='45' font-family='Arial Black,Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%231c1915'>d</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="mini-logo" id="home-link" aria-label="Diverge home" hidden>dive<span>r</span>ge</button>
    <span class="room-chip" id="room-chip" hidden></span>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Dark mode"></button>
    <button class="icon-btn" id="mute" aria-label="Toggle sound" title="Sound"></button>
  </header>
  <main id="screen" aria-live="polite"></main>
  <div class="toasts" id="toasts" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <noscript>Diverge needs JavaScript to run.</noscript>
</body>
</html>
